services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in the environment or .env file}
      DEMO_NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in the environment or .env file}
      NEO4J_dbms_usage__report_enabled: "false"
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - cypher-shell -u neo4j -p "$${DEMO_NEO4J_PASSWORD}" 'RETURN 1' >/dev/null 2>&1
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s

volumes:
  neo4j_data:

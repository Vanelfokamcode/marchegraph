<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="1280" height="560" fill="#ffffff"/>
  <text x="640" y="32" text-anchor="middle" font-size="22" font-weight="bold">Processus de base contre processus personnalisé</text>

  <!-- Base lane -->
  <rect x="20" y="60" width="1240" height="170" rx="12" fill="#f8f9fa" stroke="#adb5bd"/>
  <text x="40" y="86" font-weight="bold" font-size="16">BMAD standard</text>
  <g>
    <rect x="40" y="110" width="130" height="70" rx="8" fill="#e9ecef" stroke="#495057"/>
    <text x="105" y="140" text-anchor="middle">Idée / brief</text>
    <text x="105" y="160" text-anchor="middle" font-size="11">product-brief</text>
    <rect x="200" y="110" width="130" height="70" rx="8" fill="#e9ecef" stroke="#495057"/>
    <text x="265" y="140" text-anchor="middle">PRD</text>
    <text x="265" y="160" text-anchor="middle" font-size="11">bmad-prd</text>
    <rect x="360" y="110" width="130" height="70" rx="8" fill="#e9ecef" stroke="#495057"/>
    <text x="425" y="140" text-anchor="middle">Architecture</text>
    <text x="425" y="160" text-anchor="middle" font-size="11">bmad-architecture</text>
    <rect x="520" y="110" width="130" height="70" rx="8" fill="#e9ecef" stroke="#495057"/>
    <text x="585" y="140" text-anchor="middle">Epics / stories</text>
    <text x="585" y="160" text-anchor="middle" font-size="11">agent PO</text>
    <rect x="680" y="110" width="130" height="70" rx="8" fill="#e9ecef" stroke="#495057"/>
    <text x="745" y="140" text-anchor="middle">Build</text>
    <text x="745" y="160" text-anchor="middle" font-size="11">bmad-build</text>
    <rect x="840" y="110" width="130" height="70" rx="8" fill="#e9ecef" stroke="#495057"/>
    <text x="905" y="140" text-anchor="middle">Revue de code</text>
    <text x="905" y="160" text-anchor="middle" font-size="11">code-review</text>
    <rect x="1000" y="110" width="130" height="70" rx="8" fill="#e9ecef" stroke="#495057"/>
    <text x="1065" y="140" text-anchor="middle">Rétrospective</text>
    <text x="1065" y="160" text-anchor="middle" font-size="11">retrospective</text>
    <line x1="170" y1="145" x2="198" y2="145" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
    <line x1="330" y1="145" x2="358" y2="145" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
    <line x1="490" y1="145" x2="518" y2="145" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
    <line x1="650" y1="145" x2="678" y2="145" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
    <line x1="810" y1="145" x2="838" y2="145" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
    <line x1="970" y1="145" x2="998" y2="145" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  </g>
  <text x="40" y="214" font-size="12" fill="#555">Générique : bon pour tout logiciel, mais rien sur les données, la souveraineté, l'évaluation IA ou l'avant-vente.</text>

  <!-- Tweaked lane -->
  <rect x="20" y="250" width="1240" height="280" rx="12" fill="#f4fbf6" stroke="#2f9e44"/>
  <text x="40" y="276" font-weight="bold" font-size="16">Méthode de l'organisation (niveaux 1 à 3)</text>

  <g>
    <rect x="40" y="300" width="120" height="78" rx="8" fill="#d3f9d8" stroke="#2f9e44"/>
    <text x="100" y="326" text-anchor="middle" font-weight="bold">Qualification</text>
    <text x="100" y="346" text-anchor="middle" font-size="11">agent Avant-vente</text>
    <text x="100" y="362" text-anchor="middle" font-size="11">besoin, ROI, risques</text>

    <rect x="175" y="300" width="120" height="78" rx="8" fill="#d3f9d8" stroke="#2f9e44"/>
    <text x="235" y="326" text-anchor="middle" font-weight="bold">Données</text>
    <text x="235" y="346" text-anchor="middle" font-size="11">agent Données</text>
    <text x="235" y="362" text-anchor="middle" font-size="11">profilage, provenance</text>

    <rect x="310" y="300" width="120" height="78" rx="8" fill="#e9ecef" stroke="#495057"/>
    <text x="370" y="326" text-anchor="middle">Brief + PRD</text>
    <text x="370" y="346" text-anchor="middle" font-size="11">+ faits imposés</text>
    <text x="370" y="362" text-anchor="middle" font-size="11">(niveau 1)</text>

    <rect x="445" y="300" width="120" height="78" rx="8" fill="#d3f9d8" stroke="#2f9e44"/>
    <text x="505" y="326" text-anchor="middle" font-weight="bold">Souveraineté</text>
    <text x="505" y="346" text-anchor="middle" font-size="11">agent Conformité</text>
    <text x="505" y="362" text-anchor="middle" font-size="11">local, RGPD, licences</text>

    <rect x="580" y="300" width="120" height="78" rx="8" fill="#e9ecef" stroke="#495057"/>
    <text x="640" y="326" text-anchor="middle">Architecture</text>
    <text x="640" y="346" text-anchor="middle" font-size="11">+ règles maison</text>
    <text x="640" y="362" text-anchor="middle" font-size="11">(AD obligatoires)</text>

    <rect x="715" y="300" width="120" height="78" rx="8" fill="#d3f9d8" stroke="#2f9e44"/>
    <text x="775" y="326" text-anchor="middle" font-weight="bold">Spike modèle</text>
    <text x="775" y="346" text-anchor="middle" font-size="11">agent Évaluation IA</text>
    <text x="775" y="362" text-anchor="middle" font-size="11">capacité mesurée</text>

    <rect x="850" y="300" width="120" height="78" rx="8" fill="#e9ecef" stroke="#495057"/>
    <text x="910" y="326" text-anchor="middle">Epics / build</text>
    <text x="910" y="346" text-anchor="middle" font-size="11">contrôles maison</text>
    <text x="910" y="362" text-anchor="middle" font-size="11">(checks.*)</text>

    <rect x="985" y="300" width="120" height="78" rx="8" fill="#d3f9d8" stroke="#2f9e44"/>
    <text x="1045" y="326" text-anchor="middle" font-weight="bold">Évaluation</text>
    <text x="1045" y="346" text-anchor="middle" font-size="11">baseline puis seuil</text>
    <text x="1045" y="362" text-anchor="middle" font-size="11">fixé par l'humain</text>

    <rect x="1120" y="300" width="120" height="78" rx="8" fill="#d3f9d8" stroke="#2f9e44"/>
    <text x="1180" y="326" text-anchor="middle" font-weight="bold">Démo client</text>
    <text x="1180" y="346" text-anchor="middle" font-size="11">agent Démo</text>
    <text x="1180" y="362" text-anchor="middle" font-size="11">script, chiffres sûrs</text>

    <line x1="160" y1="339" x2="173" y2="339" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
    <line x1="295" y1="339" x2="308" y2="339" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
    <line x1="430" y1="339" x2="443" y2="339" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
    <line x1="565" y1="339" x2="578" y2="339" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
    <line x1="700" y1="339" x2="713" y2="339" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
    <line x1="835" y1="339" x2="848" y2="339" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
    <line x1="970" y1="339" x2="983" y2="339" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
    <line x1="1105" y1="339" x2="1118" y2="339" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  </g>

  <!-- Gates -->
  <rect x="40" y="400" width="1200" height="110" rx="10" fill="#ffffff" stroke="#2f9e44" stroke-dasharray="6 4"/>
  <text x="60" y="424" font-weight="bold">Points de décision humaine (« gates ») ajoutés, tous datés dans les tickets :</text>
  <text x="60" y="448">◆ Go/no-go de qualification   ◆ Données autorisées et localisation   ◆ Modèle retenu après spike   ◆ Seuil fixé après baseline</text>
  <text x="60" y="472">◆ Clôture d'epic par contrôle de fermeture   ◆ Revue de conformité avant démo   ◆ Validation des chiffres montrés au client</text>
  <text x="60" y="496" font-size="12" fill="#555">Vert = ajouté par l'organisation (niveau 2) ; gris = étape BMAD standard enrichie par réglages (niveau 1).</text>
</svg>
